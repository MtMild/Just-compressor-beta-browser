<title>Purple Compressor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>:root{color-scheme:dark;--bg0:hsl(265 18% 5%);--bg1:hsl(265 16% 8%);--panel:hsl(265 14% 11%);--panel-hi:hsl(265 12% 15%);--edge:hsl(265 10% 22%);--text:hsl(0 0% 93%);--text-dim:hsl(0 0% 62%);--white:hsl(0 0% 98%);--grey1:hsl(0 0% 40%);--grey2:hsl(0 0% 22%);--grey3:hsl(0 0% 14%);--zone-bg:hsl(0 0% 20% / 0.42);--zone-fade:hsl(0 0% 20% / 0.04);--melt-from:hsl(265 18% 5% / 0);--grid-minor:hsl(265 12% 18% / 0.45);--ghost-fill:hsl(0 0% 70% / 0.08);--ghost-line:hsl(0 0% 80% / 0.38);--hist-fade:hsl(0 0% 62% / 0.03);--out-fill:hsl(272 7% 68% / 0.32);--out-fade:hsl(272 7% 68% / 0.04);--out-line:hsl(274 75% 88%);--range-line:hsl(2 40% 56% / 0.42);--range-text:hsl(2 40% 66% / 0.75);--sc-bg:hsl(0 0% 12%);--accent:hsl(272 86% 68%);--accent-hi:hsl(280 92% 82%);--accent-lo:hsl(266 62% 46%);--glow:hsl(274 92% 66% / 0.38);--grid:hsl(265 12% 18%);--hist-fill:hsl(0 0% 62% / 0.30);--hist-line:hsl(0 0% 85% / 0.75);--red:hsl(2 82% 56%);--red-fill:hsl(2 82% 56% / 0.25);--red-dim:hsl(2 60% 38%);--gr:hsl(2 82% 56%);--gr-fill:hsl(2 82% 56% / 0.10);--boost:hsl(276 80% 88%);--boost-fill:hsl(276 80% 80% / 0.28);--curve:hsl(278 74% 74%);--threshold-line:hsl(0 0% 80% / 0.7);--meter-low:hsl(262 70% 40%);--meter-mid:hsl(272 82% 58%);--meter-hi:hsl(286 92% 80%);--clip:hsl(2 90% 58%)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg0);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px}
body{min-height:100vh;background-color:var(--bg0);background-image:radial-gradient(1200px 600px at 50% -10%,hsl(268 40% 14%),var(--bg0))}
#app{max-width:1100px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--edge);border-radius:8px;background:linear-gradient(var(--panel-hi),var(--panel));color:var(--text);font:inherit;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent);box-shadow:0 0 12px var(--glow)}
.btn:disabled{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-hi)}
.transport{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.chk{display:flex;gap:6px;align-items:center;color:var(--text-dim)}
#status{color:var(--text-dim)}
#error{flex-basis:100%;color:var(--accent-hi);min-height:0}
.knobs{display:flex;flex-wrap:wrap;gap:18px;padding:16px;border:1px solid var(--edge);border-radius:12px;background:var(--panel)}
.knob{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;user-select:none;width:84px}
.knob svg{width:72px;height:72px;touch-action:none;cursor:ns-resize;outline:none;overflow:visible}
.knob.small svg{width:52px;height:52px}
.knob svg:focus-visible .track{stroke:var(--accent-lo)}
.knob .body{fill:var(--bg1);stroke:var(--edge);stroke-width:1.5}
.knob .track{fill:none;stroke:var(--edge);stroke-width:4;stroke-linecap:round}
.knob .fill{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 3px var(--glow))}
.knob .ind{stroke:var(--accent-hi);stroke-width:2.5;stroke-linecap:round}
.knob .knob-value,.style-block .knob-value{color:var(--text);font-size:12px;font-weight:600;min-height:15px;font-variant-numeric:tabular-nums}
.knob .knob-label,.style-block .knob-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim)}
.knob.dragging .knob-label,.knob:hover .knob-label{color:var(--accent-hi)}
.tooltip{position:fixed;z-index:50;max-width:300px;padding:10px 13px;border-radius:8px;border:1px solid var(--accent-lo);background:var(--bg1);color:var(--text);font-size:12px;line-height:1.35;box-shadow:0 6px 24px hsl(265 60% 3% / .7),0 0 14px var(--glow);opacity:0;pointer-events:none;transition:opacity .12s}
.tooltip.show{opacity:1}
.tooltip::before{content:"";position:absolute;top:-6px;left:var(--arrow-x,20px);width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);background:var(--bg1);border-left:1px solid var(--accent-lo);border-top:1px solid var(--accent-lo)}
.display-wrap .scale-menu{position:absolute;right:54px;bottom:10px;z-index:5}
.display-wrap .scale-menu .menu-btn{min-width:0;padding:4px 12px;font-size:12px;background:hsl(265 16% 8% / .8);color:var(--text-dim)}
.menu.up .menu-list{top:auto;bottom:100%;margin:0 0 4px;left:auto;right:0;min-width:96px}
.menu-list button[aria-checked]{padding-left:30px;position:relative}
.menu-list button[aria-checked="true"]::before{content:"\2713";position:absolute;left:10px;color:var(--accent-hi)}
[hidden]{display:none!important}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;padding:8px 12px;border:1px solid var(--edge);border-radius:12px;background:var(--panel)}
.logo{font-weight:700;letter-spacing:.04em;font-size:18px;color:var(--accent-hi);margin-right:6px}
.logo span{color:var(--accent);margin:0 2px}
.spacer{flex:1}
.icon-btn,.toggle,.menu-btn{padding:6px 12px;border:1px solid var(--edge);border-radius:8px;background:linear-gradient(var(--panel-hi),var(--panel));color:var(--text);font:inherit;cursor:pointer}
.icon-btn:hover:not(:disabled),.toggle:hover,.menu-btn:hover{border-color:var(--accent)}
.icon-btn:disabled{opacity:.4;cursor:default}
.icon-btn[aria-pressed="true"],.toggle[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-hi);box-shadow:0 0 10px var(--glow)}
.ab-group,.preset-group{display:flex;gap:4px;align-items:center}
.menu{position:relative}
.menu-btn{min-width:150px;text-align:center}
.menu-list{display:none;position:absolute;z-index:20;top:100%;left:0;min-width:100%;margin-top:4px;padding:4px;border:1px solid var(--accent-lo);border-radius:10px;background:var(--bg1);box-shadow:0 10px 30px hsl(265 60% 3% / .8)}
.menu.open .menu-list{display:block}
.menu-list button{display:block;width:100%;padding:7px 12px;border:0;border-radius:6px;background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer;white-space:nowrap}
.menu-list button:hover{background:var(--accent-lo);color:var(--text)}
.help-panel{margin-bottom:12px;padding:10px 16px;border:1px solid var(--edge);border-radius:12px;background:var(--panel);color:var(--text-dim)}
.help-panel p{margin:4px 0}
.knobs.main{margin-bottom:12px;align-items:flex-start}
.knobs .sep{width:1px;align-self:stretch;background:var(--edge)}
.style-block{display:grid;grid-template-rows:72px auto auto;row-gap:2px;align-items:center;justify-items:center;width:84px;padding-bottom:22px}
.style-block .menu-btn{min-width:80px}
.row2{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.row2 .knobs{padding:10px 14px;gap:10px;align-items:center}
.up-block .up-panel{display:flex;gap:10px}
.sc-panel .panel-title{align-self:flex-start;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);writing-mode:vertical-rl;transform:rotate(180deg)}
canvas.hpf-curve{border:1px solid var(--edge);border-radius:8px}
.bottombar{display:flex;gap:18px;align-items:center;padding:8px 14px;border:1px solid var(--edge);border-radius:12px;background:var(--panel);color:var(--text-dim);font-size:12px}
.up-block .up-panel{flex-wrap:wrap}
.row2>.knobs{max-width:100%}
.knobs.main{justify-content:center}
@media (max-width:520px){.knobs{gap:10px;padding:12px}.menu-btn{min-width:120px}}
input[type=checkbox],input[type=range]{accent-color:var(--accent)}
button:focus-visible,[role=slider]:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#seek{width:min(260px,100%)}
#engine-mode{color:var(--text-dim);font-size:11px}

/* ---- v2 layout: demo strip + plugin frame with integrated display and settings ---- */
.demo-bar{margin-bottom:12px;padding:8px 12px;border:1px dashed var(--edge);border-radius:12px}
.demo-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin-right:4px}
#plugin{border:1px solid var(--edge);border-radius:14px;background:var(--bg1);overflow:hidden}
#plugin .topbar{margin:0;border:0;border-bottom:1px solid var(--edge);border-radius:0}
#plugin .help-panel{margin:0;border:0;border-bottom:1px solid var(--edge);border-radius:0}
.stage{position:relative}
.display-row{display:flex;gap:0;align-items:stretch}
.display-wrap{position:relative;flex:1;min-width:0;overflow:hidden}
canvas.display{display:block;width:100%;height:400px;touch-action:none}
canvas.meters{display:block;border-left:1px solid var(--edge)}
.settings{display:flex;flex-direction:column;gap:6px;padding:14px 14px 12px;background:linear-gradient(to bottom,var(--bg0),var(--bg1))}
.settings-main{display:flex;gap:14px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.settings-main .knob{padding-bottom:22px}
.settings-small{display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.auto-pill{position:absolute;bottom:0;left:50%;transform:translateX(-50%);padding:1px 9px;border:1px solid var(--grey1);border-radius:999px;background:transparent;color:var(--text-dim);font:inherit;font-size:9px;cursor:pointer;white-space:nowrap;letter-spacing:.06em}
.auto-pill:hover{border-color:var(--accent);color:var(--text)}
.auto-pill[aria-pressed="true"]{background:var(--accent-lo);border-color:var(--accent);color:var(--white)}
.acc{border-top:1px solid var(--edge)}
.acc-head{display:flex;align-items:center;gap:12px;padding:6px 12px}
.acc-btn{display:flex;align-items:center;gap:8px;padding:4px 6px;border:0;background:transparent;color:var(--text);font:inherit;letter-spacing:.08em;text-transform:uppercase;font-size:11px;cursor:pointer}
.acc-btn .chev{width:7px;height:7px;border-right:2px solid var(--text-dim);border-bottom:2px solid var(--text-dim);transform:rotate(-45deg);transition:transform .25s ease}
.acc.open .acc-btn .chev{transform:rotate(45deg)}
.acc-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.acc.open .acc-wrap{grid-template-rows:1fr}
.acc-body{overflow:hidden;min-height:0}
.acc-inner{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:6px 16px 14px}
@media (prefers-reduced-motion:reduce){.acc-wrap,.acc-btn .chev{transition:none}}
#plugin .bottombar{border:0;border-top:1px solid var(--edge);border-radius:0}

.meter-col{position:relative;flex:none;width:64px}
.meter-nums{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-around;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;pointer-events:none}
.gr-num{color:var(--red)}
.out-num{color:var(--white)}
.knob .zero-tick{stroke:var(--white);stroke-width:1.5}
.knob .zero-label{fill:var(--white);font:600 9px system-ui,sans-serif}
.knob .ring-canvas{position:absolute;left:50%;top:36px;width:88px;height:88px;transform:translate(-50%,-50%);pointer-events:none}
.knob.small .ring-canvas{top:26px}
/* AUTO: the knob is greyed out and locked, the dial turns by itself; the Threshold ring keeps its colours */
.knob.auto-on svg{cursor:default}
.knob.auto-on .fill{stroke:var(--grey1);filter:none}
.knob.auto-on .ind{stroke:var(--text-dim)}
.knob.auto-on .body{stroke:var(--grey2)}
.knob.auto-on .knob-value{color:var(--text-dim)}

.acc-inner:has(.sc-main){align-items:stretch;gap:20px}
.sc-level-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.sc-level{writing-mode:vertical-lr;direction:rtl;width:22px;height:150px;margin:0}
.sc-main{display:flex;flex-direction:column;gap:10px;flex:1 1 380px;min-width:0;max-width:760px}
canvas.sc-eq{display:block;width:100%;height:200px;border:1px solid var(--edge);border-radius:8px;touch-action:none}
.sc-knobs{display:flex;gap:12px;flex-wrap:wrap}
.sc-side{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.sc-source{font-size:11px;color:var(--text-dim)}
.acc-inner{align-items:flex-start}
.sc-knobs{align-items:flex-start}
.sc-level-wrap{align-self:flex-start}

.sc-group{display:flex;flex-direction:column;align-items:center;gap:6px}
.seg{display:flex;flex-direction:column;align-items:center;gap:3px}
.seg-row{display:flex;border:1px solid var(--grey1);border-radius:999px;overflow:hidden}
.seg-row button{padding:2px 9px;border:0;border-right:1px solid var(--grey2);background:transparent;color:var(--text-dim);font:inherit;font-size:10px;cursor:pointer}
.seg-row button:last-child{border-right:0}
.seg-row button:hover{color:var(--text)}
.seg-row button[aria-pressed="true"]{background:var(--accent-lo);color:var(--white)}

/* Upward indicator: not a button, it only shows the state */
.lamp{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--edge);border-radius:8px;color:var(--text-dim);font-size:12px;user-select:none}
.lamp::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--grey2)}
.lamp[data-state="on"]{color:var(--accent-hi);border-color:var(--accent);box-shadow:0 0 10px var(--glow)}
.lamp[data-state="on"]::before{background:var(--accent-hi);box-shadow:0 0 8px var(--accent)}


/* settings popover (gear) */
.gear-wrap{position:relative}
.icon-btn.gear{display:inline-flex;align-items:center;padding:6px 9px}
.pop{position:absolute;z-index:30;right:0;top:100%;margin-top:6px;width:330px;padding:6px;border:1px solid var(--accent-lo);border-radius:12px;background:var(--bg1);box-shadow:0 12px 34px hsl(265 60% 3% / .85)}
.pop[hidden]{display:none}
.pop-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 10px}
.pop-row+.pop-row{border-top:1px solid var(--grid)}
.pop-text div{font-size:13px;color:var(--text)}
.pop-text small{display:block;margin-top:2px;font-size:11px;color:var(--text-dim)}
.switch{position:relative;flex:none;width:38px;height:22px;border:1px solid var(--grey1);border-radius:999px;background:var(--bg0);cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text-dim);transition:transform .15s,background .15s}
.switch[aria-checked="true"]{border-color:var(--accent);background:var(--accent-lo)}
.switch[aria-checked="true"]::after{transform:translateX(16px);background:var(--white)}
.pop .seg{align-items:flex-end}
.pop .seg .knob-label{display:none}

.sc-key-hint{font-size:11px;color:var(--text-dim);max-width:150px;text-align:center;overflow-wrap:anywhere}
.sc-key-hint.warn{color:var(--accent-hi)}

.acc-inner.sc-off{opacity:.4}
#sc-enable{padding:4px 12px;font-size:12px}

/* hot bar (bottom left): small icon buttons */
.hotbar{display:flex;align-items:center;gap:6px}
.hot-btn{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:28px;padding:0 8px;border:1px solid var(--edge);border-radius:8px;background:transparent;color:var(--text-dim);font:600 11px system-ui,sans-serif;letter-spacing:.02em;cursor:pointer}
.hot-btn:hover{color:var(--text);border-color:var(--accent)}
.hot-btn[aria-pressed="true"]{color:var(--accent-hi);border-color:var(--accent);background:var(--accent-lo);box-shadow:0 0 8px var(--glow)}
#bpm-readout{margin-left:4px;color:var(--text-dim);font-variant-numeric:tabular-nums}
#bpm{width:56px;padding:2px 4px;border:1px solid var(--edge);border-radius:6px;background:var(--bg1);color:var(--text);font:inherit}
</style>

  next.addEventListener("click", () => store.nextPreset());
  var presetMenu = createMenu({ buttonId: "preset-name", menuId: "preset-menu", itemClass: "preset-item", items: PRESETS.map((p, i) => ({ id: String(i), label: p.name })), onPick: (id) => store.loadPreset(Number(id)) });
  var presets = el("div", "preset-group");
  presets.append(prev, presetMenu, next);
  var helpBtn = el("button", "icon-btn", "Help");
  helpBtn.id = "help";
  helpBtn.type = "button";
  var fsBtn = el("button", "icon-btn", "Fullscreen");
  fsBtn.id = "fullscreen";
  fsBtn.type = "button";
  fsBtn.addEventListener("click", () => {
    try {
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    } catch {
    }
  });
  var osSeg = createSegmented({ id: "oversampling", label: "", options: [1, 2, 4, 8], labels: { 1: "Off", 2: "2x", 4: "4x", 8: "8x" }, tip: "oversampling", onPick: (v) => setParam("oversampling", v) });
  var llSwitch = el("button", "switch");
  llSwitch.id = "low-latency";
  llSwitch.type = "button";
  llSwitch.setAttribute("role", "switch");
  llSwitch.setAttribute("aria-checked", "false");
  llSwitch.setAttribute("aria-label", "Low latency mode");
  llSwitch.dataset.tooltip = "lowLatency";
  attachTooltip(llSwitch, TOOLTIPS.lowLatency);
  llSwitch.addEventListener("click", () => setParam("lowLatency", !store.params.lowLatency));
  var popRow = (title, hint, control) => {
    const r = el("div", "pop-row");
    const t = el("div", "pop-text", `<div>${title}</div>${hint ? `<small>${hint}</small>` : ""}`);
    r.append(t, control);
    return r;
  };
  var settingsPanel = el("div", "pop");
  settingsPanel.id = "settings-panel";
  settingsPanel.hidden = true;
  settingsPanel.append(popRow("Oversampling", "Less aliasing, more CPU and delay", osSeg), popRow("Low latency mode", "Graphics at 30 fps, leaves more CPU to the audio", llSwitch));
  var gearBtn = el("button", "icon-btn gear", '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>');
  gearBtn.id = "settings-btn";
  gearBtn.type = "button";
  gearBtn.setAttribute("aria-label", "Settings");
  gearBtn.setAttribute("aria-haspopup", "true");
  gearBtn.setAttribute("aria-expanded", "false");
  gearBtn.dataset.tooltip = "settings";
  attachTooltip(gearBtn, TOOLTIPS.settings);
  var gearWrap = el("div", "gear-wrap");
  gearWrap.append(gearBtn, settingsPanel);
  var setPanel = (open) => {
    settingsPanel.hidden = !open;
    gearBtn.setAttribute("aria-expanded", String(open));
  };
  gearBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    setPanel(settingsPanel.hidden);
  });
  settingsPanel.addEventListener("click", (e) => e.stopPropagation());
  window.addEventListener("click", () => setPanel(false));
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") setPanel(false);
  });
  top.append(logo, undo, redo, ab, presets, el("div", "spacer"), helpBtn, fsBtn, gearWrap);
  root.appendChild(top);
  var help = el("div", "help-panel");
  help.id = "help-panel";
  help.hidden = true;
  help.innerHTML = "<p>Drag a knob to change it. Shift = fine, mouse wheel = step, Alt+click = reset.</p><p>Drag the threshold line, the KNEE tab and the dots right on the display.</p><p>Hover any control for 2.5 seconds to see a tip (it appears under Help).</p><p>Original/Compressed switches at equal loudness. Bottom left: 1:1 = unity gain (the loudness stays that of the input, so you hear only the effect of the compression), SYNC = Tempo sync (Attack and Release in note values). Double-click the display to reset its zoom.</p><p>AUTO knobs turn by themselves and show the live value (updated 4 times a second). Auto Attack: the knob is the slowest attack, the more the signal overshoots the threshold the faster it gets. Auto Release: about 30 ms for rare hits, up to 800 ms when the sound is compressed all the time.</p>";
  helpBtn.addEventListener("click", () => {
    help.hidden = !help.hidden;
  });
  root.appendChild(help);
  var transport = createTransport({
    onKey(name) {
      keyName = name;
      syncUI(store.params);
    },
    onBpm(v) {
      hostBpm = v;
      if (engine) engine.setParams({ bpm: v });
      syncUI(store.params);
    },
    onEngine(e) {
      engine = e;
      e.setMode(transport.getMode());
      e.setParams(store.params);
      e.setParams({ bpm: hostBpm });
      e.onMeters((m) => {
        window.__lastMeters = m;
        display.pushMeters(m);
        meters.push(m);
        if (Number.isFinite(m.latencySamples)) document.getElementById("latency-readout").textContent = `Latency: ${(1e3 * m.latencySamples / e.ctx.sampleRate).toFixed(1)} ms`;
        knobs.threshold.setRing(m.inPeakDb, m.thresholdDb);
        liveAuto(m);
      });
    }
  });
  app.append(transport.el, plugin);
  var display = createDisplay({ getParams: () => store.params, setParam });
  var meters = createMeters();
  var dRow = el("div", "display-row");
  dRow.append(display.el, meters.el);
  var stage = el("div", "stage");
  var settings = el("div", "settings");
  stage.append(dRow, settings);
  root.appendChild(stage);
  var knobs = {};
  function liveAuto(m) {
    const p = store.params;
    if (p.autoThreshold) knobs.threshold.setLive(m.thresholdDb);
    if (p.autoAttack) knobs.attack.setLive(m.autoAttackMs);
    if (p.autoRelease) knobs.release.setLive(m.autoReleaseMs);
    if (p.autoGain) knobs.gain.setLive(p.gain + (m.autoGainDb || 0));
  }
  var fmtMs = (v) => v < 100 ? `${v.toFixed(1)} ms` : `${Math.round(v)} ms`;
  var SYNC = { release: { note: "releaseNote", list: NOTES, max: 2500, auto: "autoRelease" }, attack: { note: "attackNote", list: ATTACK_NOTES, max: 250, auto: "autoAttack" } };
  var syncMode = { release: "ms", attack: "ms" };
  var AUTO = { threshold: ["auto-threshold", "autoThreshold"], attack: ["auto-attack", "autoAttack"], release: ["auto-release", "autoRelease"], gain: ["autogain", "autoGain"] };
  var knob = (id, label, size, tip) => {
    const a = AUTO[id];
    knobs[id] = createKnob({
      id,
      label,
      spec: PARAM_SPECS[id],
      value: store.params[id],
      onChange: (v) => setParam(id, v),
      size,
      tip,
      ring: id === "threshold",
      auto: a ? { id: a[0], tip: a[1], onToggle: () => setParam(a[1], !store.params[a[1]]) } : null
    });
    return knobs[id];
  };
  var toggles = {};
  var upToggle = createToggle({ id: "upward", label: "Off", tip: "upward", onClick: () => setParam("upward", !store.params.upward) });
  var setLamp = () => {
    const on = store.params.upward;
    upToggle.setPressed(on);
    upToggle.textContent = on ? "On" : "Off";
    upAcc.inner.classList.toggle("sc-off", !on);
  };
  toggles.bypass = createToggle({ id: "bypass", label: "Bypass", tip: "bypass", onClick: () => setParam("bypass", !store.params.bypass) });
  var styleBlock = el("div", "style-block", '<div class="knob-value">&nbsp;</div><div class="knob-label">Style</div>');
  var styleMenu = createMenu({ buttonId: "style-btn", menuId: "style-menu", itemClass: "style-item", tip: "style", items: Object.entries(STYLES).map(([id, s]) => ({ id, label: s.label })), onPick: (id) => setParam("style", id) });
  styleBlock.prepend(styleMenu);
  var settingsMain = el("div", "settings-main");
  settingsMain.append(knob("threshold", "Threshold"), knob("ratio", "Ratio"), styleBlock, knob("attack", "Attack"), knob("release", "Release"), knob("gain", "Gain"), knob("mix", "Mix"));
  var settingsSmall = el("div", "settings-small");
  settingsSmall.append(knob("knee", "Knee", "small"), knob("range", "Range", "small"), knob("lookahead", "Lookahead", "small"), knob("hold", "Hold", "small"));
  settings.append(settingsMain, settingsSmall);
  var upOpen = false;
  var lastUpward = false;
  var upAcc = createAccordion({ id: "upward-acc", bodyId: "upward-panel", title: "Upward", headerExtra: upToggle, onToggle: (v) => {
    upOpen = v;
  } });
  upAcc.inner.append(knob("upAmount", "Amount", "small"), knob("upWindow", "Window", "small"), knob("upMaxBoost", "Max Boost", "small"), knob("upFloor", "Floor", "small"));
  toggles.scOn = createToggle({ id: "sc-enable", label: "On", tip: "scOn", onClick: () => setParam("scOn", !store.params.scOn) });
  var scAcc = createAccordion({ id: "sc-acc", bodyId: "sc-panel", title: "Side Chain", headerExtra: toggles.scOn });
  var specBuf = new Float32Array(4096);
  var scEq = createScEq({
    getParams: () => store.params,
    setParam,
    getSpectrum: () => engine && engine.spectrum(specBuf) ? { data: specBuf, sr: engine.ctx.sampleRate } : null,
    getSampleRate: () => engine ? engine.ctx.sampleRate : 48e3,
    isVisible: () => scAcc.classList.contains("open")
  });
  toggles.scListen = createToggle({ id: "sc-listen", label: "Listen", tip: "scListen", onClick: () => setParam("scListen", !store.params.scListen) });
  var level = el("div", "sc-level-wrap", '<div class="knob-label">Level</div><input id="sc-level" class="sc-level" type="range" min="-24" max="24" step="0.1" value="0" aria-label="Sidechain level" data-tooltip="scLevel"><div id="sc-level-val" class="knob-value">0.0 dB</div>');
  var levelInput = level.querySelector("#sc-level");
  attachTooltip(levelInput, TOOLTIPS.scLevel);
  levelInput.addEventListener("input", () => setParam("scLevel", Number(levelInput.value)));
  levelInput.addEventListener("pointerdown", (e) => {
    if (e.altKey) {
      e.preventDefault();
      setParam("scLevel", 0);
    }
  });
  var srcSeg = createSegmented({ id: "sc-source", label: "Source", options: [0, 1], labels: { 0: "Internal", 1: "External" }, tip: "scSource", onPick: (v) => setParam("scExternal", v === 1) });
  var keyHint = el("div", "sc-key-hint");
  keyHint.id = "sc-key-hint";
  var scSide = el("div", "sc-side");
  scSide.append(srcSeg, keyHint, toggles.scListen);
  var scKnobs = el("div", "sc-knobs");
  scKnobs.append(knob("sidechainHpf", "HPF", "small"), knob("scLpf", "LPF", "small"), knob("scBandFreq", "Band Freq", "small", "scBand"), knob("scBandGain", "Band Gain", "small", "scBand"), knob("scBandQ", "Band Q", "small", "scBand"));
  var scMain = el("div", "sc-main");
  scMain.append(scEq.el, scKnobs);
  scAcc.inner.append(level, scMain, scSide);
  var bottom = el("div", "bottombar");
  bottom.id = "bottombar";
  var span = (id) => {
    const s = el("span", "");
    s.id = id;
    return s;
  };
  var hotBtn = (id, content, tip, label, onClick) => {
    const b = el("button", "hot-btn", content);
    b.id = id;
    b.type = "button";
    b.setAttribute("aria-label", label);
    b.setAttribute("aria-pressed", "false");
    b.dataset.tooltip = tip;
    attachTooltip(b, TOOLTIPS[tip]);
    b.addEventListener("click", onClick);
    return b;
  };
  var unityBtn = hotBtn("unity-gain", "1:1", "unity", "Unity gain", () => setParam("unity", !store.params.unity));
  var tempoBtn = hotBtn("tempo-sync", "SYNC", "tempoSync", "Tempo sync", () => setParam("tempoSync", !store.params.tempoSync));
  var hot = el("div", "hotbar");
  hot.append(unityBtn, tempoBtn, span("bpm-readout"));
  bottom.append(hot, el("div", "spacer"), span("la-readout"), span("latency-readout"), toggles.bypass);
  root.append(upAcc, scAcc, bottom);
  function syncUI(p) {
    for (const [id, cfg] of Object.entries(SYNC)) {
      const mode = p.tempoSync && !p[cfg.auto] ? "note" : "ms";
      if (mode === "note") knobs[id].setSpec({
        spec: PARAM_SPECS[cfg.note],
        value: p[cfg.note],
        onChange: (v) => setParam(cfg.note, Math.round(v)),
        format: (v) => `${cfg.list[Math.round(v)].label} \xB7 ${fmtMs(noteToMs(v, hostBpm, cfg.list, cfg.max))}`
      });
      else if (syncMode[id] === "note") knobs[id].setSpec({ spec: PARAM_SPECS[id], value: p[id], onChange: (v) => setParam(id, v) });
      syncMode[id] = mode;
    }
    for (const [id, k] of Object.entries(knobs)) {
      const key = syncMode[id] === "note" ? SYNC[id].note : id;
      if (k.value !== p[key]) k.setValue(p[key]);
    }
    for (const [knobId, [, key]] of Object.entries(AUTO)) knobs[knobId].setAuto(p[key]);
    setLamp();
    toggles.bypass.setPressed(p.bypass);
    styleMenu.setLabel(STYLES[p.style].label);
    if (p.upward && !lastUpward) upOpen = true;
    lastUpward = p.upward;
    upAcc.setOpen(upOpen);
    presetMenu.setLabel(store.presetName + (store.modified ? " *" : ""));
    unityBtn.setAttribute("aria-pressed", String(p.unity));
    tempoBtn.setAttribute("aria-pressed", String(p.tempoSync));
    {
      const r = document.getElementById("bpm-readout");
      r.textContent = p.tempoSync ? `${hostBpm} BPM` : "";
    }
    osSeg.setValue(p.oversampling);
    llSwitch.setAttribute("aria-checked", String(p.lowLatency));
    setLowLatency(p.lowLatency);
    document.getElementById("la-readout").textContent = `Lookahead: ${p.lookahead.toFixed(1)} ms`;
    undo.disabled = !store.canUndo;
    redo.disabled = !store.canRedo;
    abA.setAttribute("aria-pressed", String(store.ab.current === "A"));
    abB.setAttribute("aria-pressed", String(store.ab.current === "B"));
    levelInput.value = String(p.scLevel);
    document.getElementById("sc-level-val").textContent = `${p.scLevel >= 0 ? "+" : ""}${p.scLevel.toFixed(1)} dB`;
    toggles.scOn.setPressed(p.scOn);
    toggles.scOn.textContent = p.scOn ? "On" : "Off";
    scAcc.inner.classList.toggle("sc-off", !p.scOn);
    scAcc.inner.inert = !p.scOn;
    toggles.scListen.setPressed(p.scListen);
    srcSeg.setValue(p.scExternal ? 1 : 0);
    keyHint.textContent = !p.scExternal ? "" : keyName ? `Key: ${keyName}` : "No key track: use Load sidechain audio above";
    keyHint.classList.toggle("warn", p.scExternal && !keyName);
  }
  syncUI(store.params);
  window.__TOOLTIPS = TOOLTIPS;
  window.__audioState = () => transport.getEngine() ? transport.getEngine().ctx.state : "not-started";
  window.__engineState = () => transport.getEngine() ? { ...transport.getEngine().state } : { duration: 0, position: 0, playing: false };
  window.__geom = () => display.geom();
  window.__frameInterval = () => frameInterval();
  window.__timeWindow = () => display.windowSeconds();
  window.__handles = () => display.handles();
  window.__scGeom = () => scEq.geom();
  window.__scNodes = () => scEq.nodes();
  window.__drawnThreshold = () => display.drawnThreshold();
  window.__params = () => store.params;
  window.__setParam = setParam;
  window.__engineMode = () => transport.getEngine() ? transport.getEngine().mode : "not-started";
})();
</script>
